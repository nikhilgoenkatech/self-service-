apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-demo-config
data:
  TRANSACTIONS_PER_MINUTE: "10"
  PAYMENT_TYPE_WEIGHTS: "40,25,25,10"
  SCENARIO_WEIGHTS: "95,3,2"
  # Optional existing collector base URL, e.g. http://otel-collector:4318
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-generator
  labels:
    app.kubernetes.io/part-of: payments-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-generator
  template:
    metadata:
      labels:
        app: payment-generator
        app.kubernetes.io/part-of: payments-demo
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: payment-generator
          image: payments-demo:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: payments-demo-config
          env:
            - name: SERVICE
              value: generator
            - name: NEXT_SERVICE_URL
              value: http://payment-channel:8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payment-generator
spec:
  selector:
    app: payment-generator
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
